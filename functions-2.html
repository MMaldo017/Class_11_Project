<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions Assignment 2</title>
</head>
<body>
    <script>
        function double(num) {
            return num * 2;
        }

        console.log("For Double");
        console.log(double(5));
        console.log(double(7));

        function triple(num) {
        return num * 3;
    }

    console.log("For Triple");
    console.log(triple(5));
    console.log(triple(7));

    function apply(num, func) {
        return func(num);
    }


    console.log("apply w/ double");
    console.log(apply(5, double));
    console.log(apply(7, double));


    console.log("apply w/ triple");
    console.log(apply(5, triple));
    console.log(apply(7, triple));

    </script>

    
</body>
</html>
